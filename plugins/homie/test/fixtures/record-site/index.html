<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Studio</title>
<style>
  body { margin: 0; font: 600 28px/1.3 system-ui, sans-serif; background: #10131c; color: #f2f4fa; }
  main { min-height: 140vh; display: grid; place-items: start center; padding-top: 18vh; }
  a[data-play] { display: inline-block; padding: 18px 44px; border-radius: 14px; background: #ffcf5a; color: #10131c; text-decoration: none; }
  a[data-play]:hover { background: #ffe39a; }
  input { font: inherit; padding: 8px 12px; margin-top: 24px; width: 320px; }
</style>
<main>
  <div>
    <h1>Demo Dash</h1>
    <a data-play href="/demo/play">Play</a><br>
    <input name="nick" placeholder="Your name" aria-label="Your name">
  </div>
</main>
