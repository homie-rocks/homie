# Publish the @homie-rocks packages to npm with trusted publishing (OIDC): no npm
# token is stored anywhere, and every version carries a provenance attestation that
# links it to this repository, this workflow and the commit.
#
# A release is a tag named release-*, pushed directly or made with a GitHub release:
#   git tag release-2026-10-01 && git push origin release-2026-10-01
# The job verifies successful CI on the exact commit, builds, checks packaging, then publishes
# each package whose package.json version is not on npm yet, in dependency order
# (scripts/publish.mjs). Versions already on npm are skipped, so re-running a release
# is safe. A studio version with no section in CHANGELOG.md is refused before anything
# is published, and the tag's GitHub release gets that section as its notes. A package
# that is not on npm at all is published once by a maintainer
# (scripts/first-publish.sh), because trusted publishing only adds versions.
#
# Each package lists this workflow as its trusted publisher on npmjs.com (package
# Settings > Trusted Publisher > GitHub Actions: organization homie-rocks, repository
# homie, workflow publish.yml, environment npm). The job runs in the `npm` environment,
# which only release-* tags may deploy to (repository Settings > Environments).
name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Verify CI and packaging without publishing or attaching a release
        type: boolean
        required: true
        default: true
  push:
    tags: ['release-*']
  release:
    types: [published]

permissions:
  contents: read
  checks: read
  actions: read
  id-token: write # trusted publishing and provenance

jobs:
  publish:
    if: github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/release-')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    environment: npm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The rolling-upgrade tests need preceding release tags and their ancestry.
          fetch-depth: 0
      - name: Require successful CI on this exact commit (Checks API, fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export TARGET_SHA=$(git rev-parse HEAD)
          node scripts/ci-verified.mjs
      - uses: ./.github/actions/ci-setup
        with:
          node: 24
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm 11 (trusted publishing needs 11.5.1 or later)
        run: npm install -g npm@11
      - name: CHANGELOG.md has this studio version's section
        run: node scripts/changelog.mjs --check
      - name: What goes out
        run: node scripts/publish.mjs --check
      - name: Publish
        run: node scripts/publish.mjs

  dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Require successful CI on this exact commit (Checks API, fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export TARGET_SHA=$(git rev-parse HEAD)
          node scripts/ci-verified.mjs
      - uses: ./.github/actions/ci-setup
        with:
          node: 24
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm 11 (same toolchain as publishing)
        run: npm install -g npm@11
      - run: node scripts/changelog.mjs --check
      - run: node scripts/publish.mjs --check
      - name: Strict publish dry run (no npm publication, release upload or environment deployment)
        run: node scripts/publish.mjs --dry-run --strict

  desktop:
    # Homie for Claude Desktop: this release's .mcpb (desktop/, scripts/desktop.mjs), checked as the app starts it,
    # and attached to the tag's GitHub release (made when the tag has none), as homie-studio-<version>.mcpb and as
    # homie-studio.mcpb, which releases/latest/download/homie-studio.mcpb always names. The release's notes are the
    # version's CHANGELOG.md section with the extension's line under it (scripts/changelog.mjs --notes).
    if: always() && (needs.publish.result == 'success' || needs.dry-run.result == 'success')
    needs: [publish, dry-run]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Pack and check the extension
        run: node scripts/desktop.mjs --check
      - if: github.event_name != 'workflow_dispatch'
        name: Attach it to the release, with the version's CHANGELOG.md section as its notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          v=$(node -p "require('./packages/studio/package.json').version")
          cp "desktop/dist/homie-studio-$v.mcpb" desktop/dist/homie-studio.mcpb
          notes="$RUNNER_TEMP/notes.md"
          node scripts/changelog.mjs --notes "$v" --tag "$TAG" > "$notes" || printf 'Homie for Claude Desktop %s: desktop/README.md says how to install it.\n' "$v" > "$notes"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes-file "$notes"
          gh release edit "$TAG" --notes-file "$notes"
          gh release upload "$TAG" "desktop/dist/homie-studio-$v.mcpb" desktop/dist/homie-studio.mcpb --clobber

  queue-watchdog:
    if: github.event_name != 'workflow_dispatch'
    name: Fail a release stuck waiting for a runner or environment
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: write
    steps:
      - name: Bound the publish job's waiting time to four minutes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for i in $(seq 1 24); do
            state=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.name == "publish") | .status')
            if [ "$state" = in_progress ] || [ "$state" = completed ]; then exit 0; fi
            sleep 10
          done
          echo '::error::Publish waited four minutes for a runner/environment. Check Actions capacity and the npm environment approval/tag rules, then rerun this release.'
          gh api --method POST "repos/$REPO/actions/runs/$RUN_ID/cancel"
          exit 1
