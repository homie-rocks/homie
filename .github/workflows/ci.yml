name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the nightly/release suite on this ref
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  full:
    if: github.event_name == 'workflow_dispatch' && inputs.full
    uses: ./.github/workflows/nightly.yml

  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      paths: ${{ steps.diff.outputs.paths }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-paths.txt
          echo "paths=$(node -e 'console.log(JSON.stringify(require("fs").readFileSync("changed-paths.txt","utf8").trim().split("\n")))')" >> "$GITHUB_OUTPUT"

  package-shards:
    needs: changes
    env:
      HOMIE_TEST_FIXTURES: /tmp/homie-studio-fixtures
    name: Package shard ${{ matrix.shard }} (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 13
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 22, shard: 0, mode: '' }
          - { node: 22, shard: 1, mode: '' }
          - { node: 22, shard: 2, mode: '' }
          - { node: 22, shard: 3, mode: '' }
          - { node: 22, shard: 4, mode: '' }
          - { node: 22, shard: 5, mode: '' }
          - { node: 22, shard: 6, mode: '' }
          - { node: 22, shard: 7, mode: '' }
          - { node: 22, shard: 8, mode: '' }
          - { node: 22, shard: 9, mode: '' }
          - { node: 22, shard: 10, mode: '' }
          - { node: 22, shard: 11, mode: '' }
          - { node: 22, shard: 12, mode: '' }
          - { node: 22, shard: 13, mode: '' }
          - { node: 22, shard: 14, mode: '' }
          - { node: 22, shard: 15, mode: '' }
          - { node: 24, shard: 0, mode: '--compat' }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/ci-setup
        with:
          node: ${{ matrix.node }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/homie-studio-fixtures
          key: studio-fixtures-v1-${{ runner.os }}-node${{ matrix.node }}-${{ matrix.shard }}-${{ hashFiles('package-lock.json', 'template/**', 'packages/**', 'scripts/ci-shards.mjs') }}
      - name: stripe-mock (the shop's tests send their Checkout Sessions and refunds to Stripe's own open-source API mock)
        # Pinned and checked by SHA-256. It is stateless, checks every parameter against Stripe's API description,
        # and never reaches Stripe: no key, no account, no money.
        run: |
          curl -fsSL -o stripe-mock.tgz https://github.com/stripe/stripe-mock/releases/download/v0.206.0/stripe-mock_0.206.0_linux_amd64.tar.gz
          echo "b6fe5a8f02aaeb5a5001710b304fc93a222f1983a9a6050a38f55cfdc48b8d19  stripe-mock.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/stripe-mock" && tar xzf stripe-mock.tgz -C "$RUNNER_TEMP/stripe-mock" && rm stripe-mock.tgz
          "$RUNNER_TEMP/stripe-mock/stripe-mock" -http-port 12111 -https-port 12112 > "$RUNNER_TEMP/stripe-mock.log" 2>&1 &
          for i in $(seq 1 30); do curl -fs -u sk_test_ci: http://127.0.0.1:12111/v1/checkout/sessions?limit=1 > /dev/null && break; sleep 1; done
          echo "STRIPE_MOCK_URL=http://127.0.0.1:12111" >> "$GITHUB_ENV"
      - name: Release history only when this shard tests upgrades
        env:
          CI_CHANGED_PATHS: ${{ needs.changes.outputs.paths }}
        run: |
          if node scripts/ci-shards.mjs ${{ matrix.shard }} ${{ matrix.mode }} --files | grep -q 'packages/studio/test/upgrade.test.mjs'; then
            git fetch --unshallow --tags origin
          fi
      - name: Run every assigned file, with a bounded wall clock
        env:
          CI_CHANGED_PATHS: ${{ needs.changes.outputs.paths }}
        run: |
          timeout --signal=TERM --kill-after=15s 11m node scripts/ci-shards.mjs ${{ matrix.shard }} ${{ matrix.mode }} || {
            code=$?
            if [ "$code" = 124 ] || [ "$code" = 137 ]; then
              echo '::error::Shard exceeded 11 minutes. See the last file group for a stuck runner or unbounded wait.'
            fi
            exit "$code"
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: timings-node${{ matrix.node }}-${{ matrix.shard }}
          path: ci-results/

  packaging:
    if: github.event_name == 'pull_request'
    name: Packaging (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/ci-setup
        with:
          node: ${{ matrix.node }}
      - name: Fresh lockfile install (also exercises npm 11 on Node 24)
        run: npm ci
      - run: npm run prepack --workspaces --if-present
      - run: node scripts/publish.mjs --check

  packages:
    name: Packages (Node ${{ matrix.node }})
    if: always() && github.event_name == 'pull_request'
    needs: [package-shards, packaging, plugin, studio-scenarios]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Every full-suite and compatibility shard and both packaging jobs passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const n=JSON.parse(process.env.RESULTS); if(Object.values(n).some(j=>j.result!=="success")) { console.error("Required package shard or packaging check failed/cancelled/skipped",n); process.exit(1); }'

  plugin:
    if: github.event_name == 'pull_request'
    name: Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: ffmpeg (the media skills' tests render and measure real files)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - name: The plugin's tests
        run: npm run test:plugin
      - name: claude plugin validate (the marketplace and the plugin, with the Homie mod's hooks module)
        run: |
          npx -y @anthropic-ai/claude-code@2.1.287 plugin validate .
          npx -y @anthropic-ai/claude-code@2.1.287 plugin validate plugins/homie
      - name: claude plugin test (the Homie mod's hooks, commands and drawings, on the terminal and the desktop)
        run: npx -y @anthropic-ai/claude-code@2.1.287 plugin test plugins/homie
      - name: Homie for Claude Desktop (the .mcpb validates with mcpb, packs, and its packed server answers as the app starts it)
        run: node scripts/desktop.mjs --check

  changelog:
    if: github.event_name == 'pull_request'
    # A pull request that moves @homie-rocks/studio's version adds that version's section to CHANGELOG.md (and its
    # copy in the package). The check prints exactly what to write when it is missing.
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Fetch the comparison commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --depth=1 origin "$BASE_SHA"
      - name: A section for the studio's version, naming the plugin's, and the package's copy the same file
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/changelog.mjs --check ${BASE:+--base "$BASE"}

  studio-scenarios:
    if: github.event_name == 'pull_request'
    # The check a Claude Code cloud session runs, on a Linux VM with no GPU (the closest free stand-in): a studio
    # from the public template, @homie-rocks/studio from this checkout, Chrome for Testing, `homie-studio dev`, and
    # the real two-browser check. It prints each browser's frame rate and renderer (SwiftShader here).
    name: Linux studio (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    strategy:
      fail-fast: false
      matrix:
        scenario: [gem-rush]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The template is what the toolkit writes
        run: node scripts/template.mjs --check
      - name: ffmpeg (the video skill's page recorder encodes its takes)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/homie-studio/chrome
          key: chrome-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'packages/studio/lib/chrome.mjs') }}
      - name: New studio, real Chrome, recording, perf, lab and controls (or legacy round)
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          if [ "$SCENARIO" = legacy ]; then
            node scripts/studio-check.mjs --chrome-for-testing --legacy
          else
            node scripts/studio-check.mjs --chrome-for-testing --game "$SCENARIO"
          fi

  studio-linux:
    name: A studio on Linux, no GPU (two browsers finish a round)
    if: always() && github.event_name == 'pull_request'
    needs: studio-scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULT: ${{ needs.studio-scenarios.result }}
        run: test "$RESULT" = success
