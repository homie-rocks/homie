name: CI toolchain
description: Lockfile dependencies, downloaded browsers, workerd and content-addressed TypeScript output
inputs:
  node:
    default: '22'
    description: Node version
runs:
  using: composite
  steps:
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: ${{ inputs.node }}
        cache: npm
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      id: dependencies
      with:
        path: |
          node_modules
          packages/*/node_modules
        key: deps-${{ runner.os }}-${{ runner.arch }}-node${{ inputs.node }}-${{ hashFiles('package-lock.json', '**/package.json') }}
    - if: steps.dependencies.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cache/homie-studio/chrome
          ~/.cache/puppeteer
        key: chrome-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'packages/studio/lib/chrome.mjs') }}
    # Workspace prepare generates sources outside node_modules (nav and physics).
    # Run it even on a dependency hit, before calculating the build cache key.
    - shell: bash
      run: npm run prepare --workspaces --if-present
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      id: build
      with:
        path: |
          packages/*/dist
          packages/*/tsconfig.tsbuildinfo
        key: tsc-${{ runner.os }}-${{ runner.arch }}-node${{ inputs.node }}-${{ hashFiles('package-lock.json', 'package.json', 'tsconfig*.json', 'packages/*/package.json', 'packages/*/tsconfig.json', 'packages/*/src/**', 'packages/*/scripts/**') }}
    - shell: bash
      run: npm run build
    # The package contracts require emitted files to be newer than their source.
    # An exact content-key hit has matching bytes, but retains the previous job's
    # mtimes. Materialize them now, after tsc has validated the project graph.
    - if: steps.build.outputs.cache-hit == 'true'
      shell: bash
      run: find packages/*/dist -type f -exec touch {} +
